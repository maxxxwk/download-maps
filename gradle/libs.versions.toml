androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version = "1.13.0" }

androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version = "2.12.0" }

kotlinx-serialization = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version = "1.11.0" }

junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junitJupiter" }
